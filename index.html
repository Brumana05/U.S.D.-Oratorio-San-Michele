<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oratorio San Michele</title>
<meta name="theme-color" content="#1b4fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oratorio SM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#eef3fb;--card:#ffffff;--ink:#14213d;--mut:#5b6b82;--pri:#1b4fa8;--onpri:#fff;--acc:#e0a526;--line:#d5deeb;--ok:#1e7a46;--ko:#b3372f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
h1,h2{font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-stretch:condensed;margin:0}
main{max-width:760px;margin:0 auto;padding:16px}
.top{background:var(--pri);color:var(--onpri);border-bottom:4px solid var(--acc)}
.top>div{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:22px;line-height:1.1}.top small{opacity:.85;display:block;font-size:13px}
button,select,input{font:inherit;color:inherit}
input,select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:44px}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;min-height:44px;background:var(--pri);color:var(--onpri);font-weight:600}
button.g{background:transparent;color:inherit;border:1px solid currentColor}
button.d{background:var(--ko);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tiles{display:grid;gap:12px;margin-top:16px}
.tile{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:8px solid var(--acc);border-radius:10px;padding:20px 18px}
.tile b{font:700 30px "Arial Narrow",system-ui,sans-serif;font-stretch:condensed;display:block}.tile span{color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.p{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.p:first-child{border-top:0}.p .n{flex:1;min-width:0}
.seg{display:flex;gap:6px}.seg button{background:transparent;color:var(--ink);border:1px solid var(--line);min-width:48px}
.seg .P.on{background:var(--ok);color:#fff;border-color:var(--ok)}.seg .A.on{background:var(--ko);color:#fff;border-color:var(--ko)}
.av{width:44px;height:44px;border-radius:50%;background:var(--line);object-fit:cover;flex:none;display:grid;place-items:center;font-weight:700}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex:none}.hb{display:flex;gap:8px}
.upd{background:var(--acc);color:#1b1500;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-weight:600}.upd button{min-height:36px;padding:6px 12px}.upd .g{color:#1b1500}
.shell{min-height:100vh}#app{min-width:0}.band{display:none}
@media (min-width:1000px){.shell{display:grid;grid-template-columns:220px minmax(0,1fr) 220px}
.band{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:sticky;top:0;align-self:start;height:100vh;background:#fff;padding:20px;text-align:center}
.band.l{border-right:1px solid var(--line)}.band.r{border-left:1px solid var(--line)}
.band.l img{max-width:100%;max-height:70vh;object-fit:contain}.band.r img{max-width:160px;height:auto}
.band span{font:600 13px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.top .logo{display:none}}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.bd{background:#fff;color:var(--ink);border-radius:14px;padding:22px 18px;max-width:420px;width:100%;text-align:center;border-top:6px solid var(--acc);max-height:90vh;overflow:auto}
.bd h2{font-size:34px;color:var(--pri);margin-bottom:8px}.bp{padding:12px 0;border-top:1px solid var(--line);display:grid;justify-items:center;gap:4px}
.bp img,.ini{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--acc)}
.ini{display:grid;place-items:center;background:var(--line);font:700 40px system-ui,sans-serif;color:var(--pri)}.bp b{font-size:22px}.bp p{margin:4px 0 8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cg .h{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}
.dy{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-height:54px;padding:6px 2px;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.dy i{font-style:normal;background:var(--pri);color:#fff;border-radius:99px;font-size:12px;min-width:20px;padding:0 6px;line-height:20px}
.dy.td{border:2px solid var(--acc)}.dy.sl{background:#dbe7fb;border-color:var(--pri)}
.tag.t-campionato{background:#dbe7fb}.tag.t-coppa{background:#fbeec7}.tag.t-amichevole{background:#d9f0e2}
.mut{color:var(--mut);font-size:14px}.bar{height:8px;border-radius:4px;background:var(--ko);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:6px}.stat b{display:block;font-size:22px}
.back{margin:4px 0 8px;color:var(--pri)}.err{color:var(--ko);font-weight:600}
.login{max-width:380px;margin:10vh auto 0}.login .card{display:grid;gap:10px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}
.sc{width:64px!important;flex:0 0 64px!important;text-align:center}
</style>
</head>
<body>
<div class="shell"><aside class="band l"><img id="bl" src="logo-club.png" alt="U.S.D. Oratorio San Michele"></aside><div id="app"></div><aside class="band r"><span>Società Affiliata</span><img src="logo-union.jpg" alt="Union Brescia"></aside></div>
<script type="module">

const TEAMS=["Prima Squadra","Juniores","Allievi Under 16","Giovanissimi Under 15","Giovanissimi Under 14","Esordienti Under 13","Esordienti Under 12"];
const ROLES={admin:"Admin",allenatore:"Allenatore",collaboratore:"Collaboratore Tecnico",dirigente:"Dirigente",direttore:"Direttore"};
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,getDoc,onSnapshot,query,where,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cols=["users","players","trainings","matches"],S={users:[],players:[],trainings:[],matches:[],settings:{},bday:[],bAll:[]};
const configured=!!(firebaseConfig&&firebaseConfig.apiKey&&!firebaseConfig.apiKey.startsWith("INCOLLA"));
let app,auth,db,secApp;
if(configured){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);secApp=initializeApp(firebaseConfig,"sec")}
const VER="1,10",club=()=>S.settings.name||"U.S.D. Oratorio San Michele",logo=()=>S.settings.logo||"logo-club.png";
let me=null,ready=false,boot=false,uns=[],view="home",team=TEAMS[0],open=null,editP=null,err="",pend=false,setupMode=false,msg="",msgErr=false;
const $=id=>document.getElementById(id),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>d?new Date(d+"T12:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short",year:"numeric"}):"";
const isA=()=>me&&me.role==="admin",isD=()=>me&&me.role==="direttore",canAtt=()=>me&&me.role!=="direttore";
const em=n=>n+"@oratorio-sanmichele.app",okName=n=>/^[a-z0-9][a-z0-9_-]{2,29}$/.test(n),em2=n=>n+"_"+crypto.randomUUID().replace(/-/g,"").slice(0,8)+"@oratorio-sanmichele.app";
const fail=x=>{console.error(x);alert("Operazione non riuscita: "+(x.code||x.message))};
const save=(n,id,o)=>setDoc(doc(db,n,id),o).catch(fail);
const saveSet=o=>setDoc(doc(db,"config","club"),o).catch(fail);
const nid=n=>doc(collection(db,n)).id;
function del(n,id,m){if(confirm(m||"Confermi l'eliminazione?"))deleteDoc(doc(db,n,id)).catch(fail)}
async function batchSet(items){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(([n,id,o])=>b.set(doc(db,n,id),o));await b.commit()}}
function go(v){view=v;err="";msg="";open=null;editP=null;render()}
const pl=()=>S.players.filter(p=>p.team===team).sort((a,b)=>(a.cognome+a.nome).localeCompare(b.cognome+b.nome));
const tr=()=>S.trainings.filter(t=>t.team===team).sort((a,b)=>b.date.localeCompare(a.date));
const att=(t,p)=>(t.att||{})[p.id]||"";
const head=()=>{document.title=club();const bl=$("bl");if(bl&&bl.getAttribute("src")!==logo())bl.src=logo();return`${banner()}<div class="top"><div><div class="brand"><img class="logo" alt="" src="${logo()}"><div><h1>${e(club())}</h1><small>Versione ${VER}${me?" · "+e(me.name)+" · "+ROLES[me.role]+(me.team?" · "+e(me.team):""):""}</small></div></div>${me?`<div class="hb">${isA()?`<button class="g" aria-label="Impostazioni" title="Impostazioni" onclick="go('set')">⚙</button>`:""}<button class="g" onclick="out()">Esci</button></div>`:""}</div></div>`};
const sel=()=>(isA()||isD())?`<div class="card"><label class="mut" for="tm">Categoria</label><select id="tm" onchange="setTeam(this.value)">${TEAMS.map(t=>`<option ${t===team?"selected":""}>${t}</option>`).join("")}</select></div>`:`<h2 style="margin:8px 0">${e(team)}</h2>`;
const bk=()=>`<button class="g back" onclick="go('home')">← Indietro</button>`;
const av=p=>p.photo?`<img class="av" alt="" src="${p.photo}">`:`<div class="av">${e((p.nome||"?")[0])}${e((p.cognome||"")[0])}</div>`;

function vLogin(){return`<div class="login"><h2 style="font-size:30px;margin-bottom:8px">${setupMode?"Primo avvio: crea l'Admin":"Accedi"}</h2><div class="card">${setupMode?`<p class="mut" style="margin:0">Funziona una sola volta, quando non esiste ancora nessun Admin. Password di almeno 6 caratteri.</p>`:""}<input id="lu" placeholder="Nome utente" autocomplete="username" autocapitalize="none"><input id="lp" type="password" placeholder="Password" autocomplete="${setupMode?"new-password":"current-password"}"><div class="err">${err}</div><button onclick="${setupMode?"setup()":"login()"}">${setupMode?"Crea Admin":"Entra"}</button><button class="g" style="color:var(--mut);font-size:14px" onclick="tsetup()">${setupMode?"Torna all'accesso":"Primo avvio dell'app?"}</button></div></div>`}
function vHome(){const T=(a,b,c)=>`<button class="tile" onclick="${a}"><b>${b}</b><span>${c}</span></button>`;
return sel()+migCard()+`<div class="tiles">`+(isA()?T("go('an')","Anagrafica","Aggiungi o modifica i giocatori"):"")+T("go('tr')","Allenamenti",(isD()?"Consulta":"Segna")+" presenze e assenze")+T("go('cal')","Calendario","Partite e risultati della stagione")+T("go('st')","Statistiche","Presenze, assenze e percentuali di ogni ragazzo")+(isA()?T("go('us')","Utenti","Crea i profili di accesso")+T("exp()","Backup","Scarica tutti i dati in un file")+T("pick()","Ripristino","Carica un file di backup")+`<input id="imp" type="file" accept=".json,application/json" hidden onchange="imp(this)">`:"")+`</div>`}
function vTr(){const ps=pl();let h=bk()+sel()+`<h2>Allenamenti</h2>`;
if(isA())h+=`<div class="card row"><input id="nd" type="date"><button onclick="addT()">Aggiungi allenamento</button></div>`;
const ts=tr();if(!ts.length)h+=`<p class="mut">Nessun allenamento inserito${isA()?"":". L'Admin può aggiungerli."}</p>`;
ts.forEach(t=>{const P=ps.filter(p=>att(t,p)==="P").length,o=open===t.id;h+=`<div class="card"><div class="row" style="justify-content:space-between"><button class="g" style="color:var(--ink);flex:1;text-align:left" onclick="tgl('${t.id}')"><b>${fd(t.date)}</b> <span class="mut">· ${P}/${ps.length} presenti</span></button>${isA()?`<button class="d" onclick="del('trainings','${t.id}')">Elimina</button>`:""}</div>`;
if(o)h+=ps.length?ps.map(p=>`<div class="p">${av(p)}<div class="n">${e(p.cognome)} ${e(p.nome)}</div>${canAtt()?`<div class="seg"><button class="P ${att(t,p)==="P"?"on":""}" onclick="mk('${t.id}','${p.id}','P')">Pres.</button><button class="A ${att(t,p)==="A"?"on":""}" onclick="mk('${t.id}','${p.id}','A')">Ass.</button></div>`:`<span class="tag">${{P:"Presente",A:"Assente"}[att(t,p)]||"—"}</span>`}</div>`).join(""):`<p class="mut">Nessun giocatore in anagrafica.</p>`;h+=`</div>`});return h}
function vSt(){const ts=tr(),T=ts.length;let h=bk()+sel()+`<h2>Statistiche</h2><p class="mut">Allenamenti totali da inizio anno: <b>${T}</b></p>`;
const ps=pl();if(!ps.length)return h+`<p class="mut">Nessun giocatore in anagrafica.</p>`;
return h+ps.map(p=>{const P=ts.filter(t=>att(t,p)==="P").length,A=ts.filter(t=>att(t,p)==="A").length,pp=T?Math.round(P/T*100):0,pa=T?Math.round(A/T*100):0;return`<div class="card"><div class="p" style="border:0;padding:0">${av(p)}<div class="n"><b>${e(p.cognome)} ${e(p.nome)}</b></div></div><div class="stat"><div><b>${P}</b><span class="mut">Presenze</span></div><div><b>${A}</b><span class="mut">Assenze</span></div><div><b>${pp}%</b><span class="mut">% pres.</span></div><div><b>${pa}%</b><span class="mut">% ass.</span></div></div><div class="bar"><i style="width:${pp}%"></i></div></div>`}).join("")}
const TIPI={campionato:"Campionato",coppa:"Coppa Brescia",amichevole:"Amichevole"};
const cmpM=(a,b)=>(a.date+(a.ora||"")).localeCompare(b.date+(b.ora||""));
let calY=new Date().getFullYear(),calM=new Date().getMonth(),calSel="",calF="";
const isoD=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const admRow=m=>`<div class="row" style="margin-top:8px"><span class="mut" style="flex:0 0 auto">Gol nostri</span><input class="sc" type="number" min="0" id="gf${m.id}" value="${m.gf??""}"><span class="mut" style="flex:0 0 auto">Gol avversari</span><input class="sc" type="number" min="0" id="ga${m.id}" value="${m.ga??""}"></div><div class="row" style="margin-top:8px"><input id="ot${m.id}" type="time" value="${e(m.ora)}"><select id="tp${m.id}"><option value="">— tipo —</option>${Object.entries(TIPI).map(([k,v])=>`<option value="${k}" ${m.tipo===k?"selected":""}>${v}</option>`).join("")}</select><input id="lg${m.id}" placeholder="Luogo" value="${e(m.luogo)}"><button onclick="res('${m.id}')">Salva</button><button class="d" onclick="del('matches','${m.id}')">Elimina</button></div>`;
function mcard(m,o={}){const hasR=m.gf!==""&&m.gf!=null&&m.ga!==""&&m.ga!=null,us=club(),l=m.home==="C"?[us,m.opp]:[m.opp,us],sc=m.home==="C"?[m.gf,m.ga]:[m.ga,m.gf];
return`<div class="card"><div class="row" style="justify-content:space-between;gap:6px"><span class="mut" style="flex:1 1 auto">${fd(m.date)}${m.ora?" · ore "+e(m.ora):""}${o.team?" · "+e(m.team):""}</span>${m.tipo&&TIPI[m.tipo]?`<span class="tag t-${m.tipo}" style="flex:none">${TIPI[m.tipo]}</span>`:""}</div><div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin-top:4px"><b style="flex:1">${e(l[0])} – ${e(l[1])}</b>${hasR?`<b style="flex:none;font-size:22px">${sc[0]} - ${sc[1]}</b>`:`<span class="tag" style="flex:none">Da giocare</span>`}</div>${m.luogo?`<div class="mut">Luogo: ${e(m.luogo)}</div>`:""}${o.admin?admRow(m):""}</div>`}
function vCal(){if(isD())return vCalD();let h=bk()+sel()+`<h2>Calendario</h2>`;
if(isA())h+=`<div class="card"><b>Nuova partita</b><div class="row" style="margin-top:8px"><input id="md" type="date"><input id="mt" type="time"></div><div class="row" style="margin-top:8px"><input id="mo" placeholder="Avversario"><select id="mh"><option value="C">In casa</option><option value="T">Trasferta</option></select></div><div class="row" style="margin-top:8px"><select id="mk">${Object.entries(TIPI).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><input id="ml" placeholder="Luogo (facoltativo)"><button onclick="addM()">Aggiungi partita</button></div></div>`;
const ms=S.matches.filter(m=>m.team===team).sort(cmpM);if(!ms.length)h+=`<p class="mut">Nessuna partita inserita.</p>`;
return h+ms.map(m=>mcard(m,{admin:isA()})).join("")}
function vCalD(){const now=new Date(),td=isoD(now.getFullYear(),now.getMonth(),now.getDate());if(!calSel&&calY===now.getFullYear()&&calM===now.getMonth())calSel=td;
const by={};S.matches.filter(m=>!calF||m.team===calF).forEach(m=>(by[m.date]=by[m.date]||[]).push(m));
const start=(new Date(calY,calM,1).getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();let cells="";
for(let i=0;i<start;i++)cells+=`<div></div>`;
for(let d=1;d<=dim;d++){const k=isoD(calY,calM,d),n=(by[k]||[]).length;cells+=`<button class="dy${k===td?" td":""}${k===calSel?" sl":""}" onclick="calPick('${k}')" aria-label="${d}${n?", "+n+(n>1?" partite":" partita"):""}"><span>${d}</span>${n?`<i>${n}</i>`:""}</button>`}
const title=new Date(calY,calM,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"});
let h=bk()+`<h2>Calendario</h2><div class="card"><select id="cf" onchange="calFilt(this.value)"><option value="">Tutte le categorie</option>${TEAMS.map(t=>`<option ${t===calF?"selected":""}>${t}</option>`).join("")}</select></div><div class="card"><div class="row" style="flex-wrap:nowrap;justify-content:space-between;margin-bottom:8px"><button class="g" style="color:var(--pri)" onclick="calNav(-1)" aria-label="Mese precedente">‹</button><b style="text-transform:capitalize;flex:1;text-align:center;font-size:18px">${title}</b><button class="g" style="color:var(--pri)" onclick="calNav(1)" aria-label="Mese successivo">›</button></div><div class="cg">${["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(x=>`<div class="h">${x}</div>`).join("")}${cells}</div><div style="margin-top:8px"><button class="g" style="color:var(--pri)" onclick="calToday()">Oggi</button></div></div>`;
if(calSel){const l=(by[calSel]||[]).sort(cmpM);h+=`<h2 style="margin:8px 0">${fd(calSel)}</h2>`+(l.length?l.map(m=>mcard(m,{team:true})).join(""):`<p class="mut">Nessuna partita in questa data.</p>`)}
else h+=`<p class="mut">Tocca un giorno per vedere le partite.</p>`;return h}

async function migra(){if(!confirm("Importare nel database online i dati salvati su questo dispositivo?"))return;try{const n=await restore(localData());localStorage.setItem("osm-migrated","1");alert("Importati "+n+" elementi. Ora crea gli utenti dalla sezione Utenti.");render()}catch(x){fail(x)}}
const migCard=()=>{const d=isA()&&localData();return d?`<div class="card" style="border-left:6px solid var(--acc)"><b>Dati della versione precedente trovati</b><p class="mut" style="margin:6px 0">Su questo dispositivo ci sono ${d.players.length} giocatori, ${(d.trainings||[]).length} allenamenti e ${(d.matches||[]).length} partite. Importali nel database online.</p><button onclick="migra()">Importa nel database online</button></div>`:""}
function addT(){const d=$("nd").value;if(!d)return;if(tr().some(t=>t.date===d))return alert("Allenamento già presente in quella data.");const id=nid("trainings");open=id;save("trainings",id,{team,date:d,att:{}})}
function mk(tid,pid,v){const t=S.trainings.find(t=>t.id===tid),a={...(t.att||{})};if(a[pid]===v)delete a[pid];else a[pid]=v;updateDoc(doc(db,"trainings",tid),{att:a}).catch(fail)}
function addM(){const d=$("md").value,o=$("mo").value.trim();if(!d||!o)return alert("Inserisci data e avversario.");save("matches",nid("matches"),{team,date:d,ora:$("mt").value,opp:o,home:$("mh").value,tipo:$("mk").value,luogo:$("ml").value.trim(),gf:"",ga:""})}
function res(id){const m=S.matches.find(m=>m.id===id),f=$("gf"+id).value,a=$("ga"+id).value,{id:_,...o}=m;save("matches",id,{...o,ora:$("ot"+id).value,tipo:$("tp"+id).value,luogo:$("lg"+id).value.trim(),gf:f===""?"":+f,ga:a===""?"":+a})}
function rd(f,mx=200,ty="image/jpeg"){return new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL(ty,.75))};i.src=fr.result};fr.readAsDataURL(f)})}
async function savP(){const n=$("an1").value.trim(),c=$("an2").value.trim(),d=$("an3").value,f=$("an4").files[0];
if(!n||!c)return err="Nome e cognome sono obbligatori.",render();
const old=editP?S.players.find(p=>p.id===editP):null,photo=f?await rd(f):(old?.photo||"");
err="";const id=editP||nid("players");editP=null;await save("players",id,{team:old?.team||team,nome:n,cognome:c,dob:d,photo,ruolo:$("an5").value.trim(),cel:$("an6").value.trim(),celMamma:$("an7").value.trim(),celPapa:$("an8").value.trim()})}
