<style>

.pl{width:86px;text-align:center;color:#fff;font-size:12px}

.auth{max-width:380px;margin:40px auto;padding:20px;text-align:center}.auth img{width:90px;height:90px;border-radius:50%;object-fit:cover}
header{display:grid;grid-template-columns:1fr auto 1fr;border-bottom:3px solid #c99a1c}.hl{display:flex;align-items:center;gap:6px}.ht{text-align:center;line-height:1.15}.ht b{display:block;font-size:17px;flex:none}.ht small{font-size:10px;opacity:.85}.hr{display:flex;justify-content:flex-end;align-items:center;gap:8px}header button.gold{background:#c99a1c;font-weight:700}a.av{cursor:pointer;display:inline-flex}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const V='1.11',K='osm_v1',$=q=>document.querySelector(q),p2=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def=()=>({team:{name:'Oratorio San Michele',logo:''},players:[],events:[],users:[],votes:{}});
let S=def();
const save=()=>{if(admin())syncA()};
let me=localStorage.getItem('osm_last')||(localStorage.getItem('osm_guest')?'guest':''),tab='home',fe=null,fx=null,authMode='in';
const admin=()=>me==='Admin',canVote=()=>me&&me!=='guest'&&me!=='Admin';
const today=()=>{const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const started=x=>new Date(x.date+'T'+(x.time||'00:00'))<=new Date();
const TYPES={camp:['Campionato','#1e5bd8'],coppa:['Coppa Brescia','#c99a1c'],amic:['Amichevole','#2e9e4f'],all:['Allenamento','#8a8f98']};
const MODS=['4-3-1-2','4-4-2','4-3-3','3-5-2','4-5-1','3-4-3','4-2-3-1','3-4-1-2'];let bo=false;
const ROLES={P:'Portiere',D:'Difensore',C:'Centrocampista',A:'Attaccante'},RP={P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
function rowsOf(m){if(m==='4-3-1-2')return[['POR'],['Terz. sx','Dif. centr.','Dif. centr.','Terz. dx'],['Mezz. sx','Mediano','Mezz. dx'],['Trequart.'],['Att.','Att.']];
const n=m.split('-').map(Number);return[['POR'],...n.map((k,i)=>Array(k).fill(i==0?'DIF':i==n.length-1?'ATT':'CEN'))]}
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
let myPh=localStorage.getItem('osm_ph')||'';
const played=(ev,id)=>ev.lineup?.slots.includes(id)||((ev.lineup?.bench||[]).includes(id)&&ev.stats?.[id]?.in);
const HA=x=>x.ha==='casa'?'🏠 In casa':x.ha==='trasf'?'🚌 In trasferta':'';
let cal={y:new Date().getFullYear(),m:new Date().getMonth(),d:today()};
const msg=t=>`<div class=msg>${t}</div>`,pl=id=>S.players.find(p=>p.id===id),fmt=n=>n==null?'–':n.toFixed(1).replace('.',',');
function M(h){const m=$('#m');m.innerHTML='<div>'+h+'</div>';m.classList.add('on')}function X(){$('#m').classList.remove('on');if(pend)R()}
function go(){R()}
/* AUTH */
function vAuth(){return`<div class=auth>${`<img src="${S.team.logo||'logo.png'}">`}<h2>${e(S.team.name)}</h2><p>Giovanissimi Under 15</p>
<input id=au placeholder="Nome utente" autocapitalize=off><input id=ap type=password placeholder="Password">
<button class=b style="width:100%" onclick="doAuth()">${authMode==='in'?'Accedi':'Registrati'}</button><p><a href="#" onclick="authMode=authMode==='in'?'reg':'in';R();return false">${authMode==='in'?'Non hai un account? Registrati':'Hai già un account? Accedi'}</a></p>
<button class="b g" style="width:100%" onclick="setMe('guest')">Continua senza accedere</button><p style="font-size:12px;color:#667">Password: almeno 6 caratteri. Nome utente: lettere, numeri . _ -</p><p id=ae style="color:#c0392b">${FB_ERR}</p></div>`}
async function doAuth(){const u=$('#au').value.trim(),p=$('#ap').value,E=t=>$('#ae').textContent=t;if(!FB_OK)return E(FB_ERR);if(!u||!p)return E('Inserisci nome utente e password');
if(!/^[A-Za-z0-9._-]{3,20}$/.test(u))return E('Nome utente: 3-20 caratteri (lettere, numeri . _ -)');
try{if(authMode==='in')await auth.signInWithEmailAndPassword(mail(u),p);
else{if(u.toLowerCase()==='admin')return E('Nome utente non disponibile');regName=u;const c=await auth.createUserWithEmailAndPassword(mail(u),p);await db.collection('users').doc(c.user.uid).set({u,d:today()});me=u;regName=''}
tab='home';R()}catch(x){regName='';E({'auth/email-already-in-use':'Nome utente non disponibile','auth/weak-password':'La password deve avere almeno 6 caratteri','auth/invalid-credential':'Credenziali errate','auth/user-not-found':'Credenziali errate','auth/wrong-password':'Credenziali errate','auth/network-request-failed':'Nessuna connessione'}[x.code]||x.message)}}
function setMe(u){me=u;localStorage.setItem('osm_guest','1');tab='home';R()}
function out(){localStorage.removeItem('osm_guest');localStorage.removeItem('osm_last');me='';tab='home';if(auth&&auth.currentUser)auth.signOut();else R()}
/* CALENDARIO */
function vCal(){const f=new Date(cal.y,cal.m,1),off=(f.getDay()+6)%7,dim=new Date(cal.y,cal.m+1,0).getDate();let c='';for(let i=0;i<off;i++)c+='<div></div>';
for(let d=1;d<=dim;d++){const ds=`${cal.y}-${p2(cal.m+1)}-${p2(d)}`,ev=S.events.filter(x=>x.date===ds);c+=`<div class="day ${ds===cal.d?'sel':''} ${ds===today()?'tod':''}" onclick="cal.d='${ds}';R()">${d}<div class=dots>${ev.slice(0,4).map(x=>`<i style="background:${TYPES[x.type][1]}"></i>`).join('')}</div></div>`}
const evs=S.events.filter(x=>x.date===cal.d).sort((a,b)=>a.time.localeCompare(b.time));
return`<div class=row style="justify-content:space-between"><button class="b g" onclick="mv(-1)">‹</button><b>${MESI[cal.m]} ${cal.y}</b><button class="b g" onclick="mv(1)">›</button></div>
<div class=grid style="margin-top:8px">${['L','M','M','G','V','S','D'].map(x=>`<div class=hd>${x}</div>`).join('')}${c}</div>
<div class=row style="font-size:11px;margin:8px 0">${Object.values(TYPES).map(t=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${t[1]}"></i> ${t[0]}</span>`).join('')}</div>
<h4>${cal.d.split('-').reverse().join('/')}</h4>${evs.map(x=>`<div class=card style="border-color:${TYPES[x.type][1]}"><b style="color:${TYPES[x.type][1]}">${TYPES[x.type][0]}</b> · ${e(x.time)}<br>${x.opp?'vs '+e(x.opp)+(HA(x)?' · '+HA(x):'')+'<br>':''}${e(x.place)}
${admin()?`<div class=row style="margin-top:6px"><button class="b g" onclick="evF('${x.id}')">Modifica</button><button class="b r" onclick="evD('${x.id}')">Elimina</button></div>`:''}</div>`).join('')||msg('Nessun evento')}
${admin()?`<button class=b onclick="evF()">+ Aggiungi evento</button>`:''}`}
function mv(n){cal.m+=n;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}R()}
function evF(id){const x=S.events.find(y=>y.id===id)||{type:'camp',date:cal.d,time:'15:00',opp:'',place:''};
M(`<h3>${id?'Modifica':'Nuovo'} evento</h3><label>Tipo</label><select id=f1 onchange="$('#hw').style.display=this.value==='all'?'none':''">${Object.entries(TYPES).map(([k,v])=>`<option value=${k} ${x.type===k?'selected':''}>${v[0]}</option>`).join('')}</select><label>Data</label><input type=date id=f2 value="${x.date}"><label>Orario</label><input type=time id=f3 value="${x.time}"><label>Avversario</label><input id=f4 value="${e(x.opp)}"><label>Luogo</label><input id=f5 value="${e(x.place)}"><div id=hw style="${x.type==='all'?'display:none':''}"><label>Casa / Trasferta</label><select id=f6><option value=casa ${x.ha!=='trasf'?'selected':''}>🏠 In casa</option><option value=trasf ${x.ha==='trasf'?'selected':''}>🚌 In trasferta</option></select></div><div class=row><button class=b onclick="evS('${id||''}')">Salva</button><button class="b g" onclick="X()">Annulla</button></div>`)}
function evS(id){const o={type:$('#f1').value,date:$('#f2').value,time:$('#f3').value,opp:$('#f4').value,place:$('#f5').value,ha:$('#f1').value==='all'?'':$('#f6').value};if(!o.date)return;
if(id)Object.assign(S.events.find(y=>y.id===id),o);else S.events.push({id:uid(),...o});cal.d=o.date;save();X();R()}
function evD(id){if(confirm('Eliminare?')){S.events=S.events.filter(x=>x.id!==id);save();R()}}
/* VALUTAZIONI / FORMAZIONE */
const ids=ev=>{const L=ev.lineup;if(!L)return[];const s=L.slots.filter(Boolean);return[...s,...(L.bench||[]).filter(b=>!s.includes(b))]};
const VOTES=['','SV',...Array.from({length:13},(_,i)=>4+i*.5)];
const opts=(arr,sel)=>arr.map(v=>`<option value="${v}" ${String(sel??'')===String(v)?'selected':''}>${v===''?'—':v}</option>`).join('');
function vVal(){if(admin())return vForm();
if(!canVote())return msg('Per votare i ragazzi devi <a href="#" onclick="out();return false">accedere o registrarti</a>.');
const evs=S.events.filter(x=>x.type!=='all'&&x.date===today()&&started(x)&&ids(x).length);
if(!evs.length)return msg('Le valutazioni si aprono all\'inizio della partita e restano aperte fino a fine giornata.');
return`<p style="font-size:12px;color:#667">I voti sono un parere per aiutare l\'admin: i voti definitivi li assegna solo lui. Vedi solo i tuoi voti.</p>`+evs.map(ev=>`<div class=card style="border-color:${TYPES[ev.type][1]}"><b>${TYPES[ev.type][0]} vs ${e(ev.opp)}</b> ${HA(ev)}${ids(ev).map(id=>{const p=pl(id);return p?`<div class=row style="margin-top:6px"><span style="flex:1">${p.num?'#'+e(p.num)+' ':''}${e(p.name)}</span><select style="width:90px;margin:0" onchange="setV('${ev.id}','${id}',this.value)">${opts(VOTES,S.votes[ev.id]?.[me]?.[id])}</select></div>`:''}).join('')}</div>`).join('')}
function setV(eid,pid,v){const m=((S.votes[eid]??={})[me]??={});m[pid]=v;if(!auth||!auth.currentUser)return alert('Connessione in corso, riprova tra un attimo');const uid=auth.currentUser.uid;db.collection('votes').doc(eid+'_'+uid).set({eid,uid,user:me,v:m}).catch(x=>alert('Voto non salvato: '+x.message))}
function vForm(){if(!fe)return`<h4>Seleziona la partita</h4>`+(S.events.filter(x=>x.type!=='all').sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class=card style="border-color:${TYPES[x.type][1]}" onclick="fe='${x.id}';R()"><b>${TYPES[x.type][0]}</b> ${x.date.split('-').reverse().join('/')} vs ${e(x.opp)} ${HA(x)}<br><small>${x.lineup?'Formazione inserita':'Da compilare'}</small></div>`).join('')||msg('Aggiungi prima le partite dal Calendario'));
const ev=S.events.find(x=>x.id===fe);ev.lineup??={mod:'4-4-2',slots:[],bench:[]};ev.stats??={};const rows=rowsOf(ev.lineup.mod);let i=0;
const ps=[...S.players].sort((a,b)=>a.name.localeCompare(b.name));
const sl=rows.map(r=>r.map(lb=>{const k=i++;return`<label>${lb}</label><select onchange="setSlot(${k},this.value)"><option value="">— scegli —</option>${ps.map(p=>`<option value=${p.id} ${ev.lineup.slots[k]===p.id?'selected':''}>${e(p.name)}${p.role?' ('+p.role+')':''}</option>`).join('')}</select>`}).join('')).join('');
const st=ids(ev).map(id=>{const p=pl(id);if(!p)return'';const s=ev.stats[id]??={},gk=ev.lineup.slots[0]===id,vs=Object.values(S.votes[ev.id]||{}).map(u=>parseFloat(u[id])).filter(n=>!isNaN(n)),avg=vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(2):'–';
const num=(k,l)=>`<div><label>${l}</label><input type=number min=0 value="${s[k]||0}" onchange="setS('${id}','${k}',+this.value)"></div>`,chk=(k,l)=>`<label><input type=checkbox style="width:auto" ${s[k]?'checked':''} onchange="setS('${id}','${k}',this.checked)"> ${l}</label>`;
return`<div class=card><b>${e(p.name)}${gk?' 🧤':''}</b> <span style="float:right" id="fv${id}">Fanta: ${fmt(fanta(ev,id))}</span><br><small>Media utenti: ${avg} (${vs.length} voti)</small>
<div class=sm><div><label>Voto base</label><select onchange="setS('${id}','vote',this.value)">${opts(VOTES,s.vote)}</select></div>${num('g','Gol')}${num('a','Assist')}${num('og','Autogol')}${num('pm','Rig. sbagliati')}<div><label>Gialli</label><select onchange="setS('${id}','y',+this.value)">${opts([0,1,2],s.y||0)}</select></div>${gk?num('pen','Rigori parati')+num('conc','Gol subiti'):''}</div>
<div class=row>${chk('r','Rosso')}${chk('out','Sostituito')}${chk('in','Subentrato')}</div></div>`}).join('');
const bench=ps.filter(p=>!ev.lineup.slots.includes(p.id)).map(p=>`<label style="display:block"><input type=checkbox style="width:auto" ${ev.lineup.bench.includes(p.id)?'checked':''} onchange="setBench('${p.id}',this.checked)"> ${e(p.name)}</label>`).join('');
return`<button class="b g" onclick="fe=null;R()">‹ Partite</button><h4>${TYPES[ev.type][0]} vs ${e(ev.opp)} ${HA(ev)}</h4><div class=card>${(()=>{const src=S.events.filter(x=>x.id!==ev.id&&x.lineup?.slots.some(Boolean)).sort((a,b)=>b.date.localeCompare(a.date));return src.length?`<label>Copia formazione da una partita precedente</label><select onchange="cpL(this.value)"><option value="">— scegli partita —</option>${src.map(x=>`<option value=${x.id}>${x.date.split('-').reverse().join('/')} · ${TYPES[x.type][0]} vs ${e(x.opp)} (${x.lineup.mod})</option>`).join('')}</select>`:''})()}<label>Modulo</label><select onchange="setMod(this.value)">${MODS.map(m=>`<option ${m===ev.lineup.mod?'selected':''}>${m}</option>`).join('')}</select>${sl}<details ${bo?'open':''} ontoggle="bo=this.open"><summary>Panchina / subentrati (selezione multipla)</summary>${bench||'Nessuno'}</details></div>${ev.lineup.slots.some(Boolean)?'<h4>Anteprima formazione</h4>'+pitchHTML(ev,true):''}${ids(ev).length?'<h4>Voti e statistiche</h4>':''}${st}`}
const cur=()=>S.events.find(x=>x.id===fe);
function cpL(id){if(!id)return;const o=S.events.find(x=>x.id===id).lineup,L=cur().lineup;if(L.slots.some(Boolean)&&!confirm('Sostituire la formazione attuale con quella copiata?'))return R();L.mod=o.mod;L.slots=[...o.slots];L.bench=[...(o.bench||[])];save();R()}
function setMod(m){const L=cur().lineup;L.mod=m;L.slots=L.slots.slice(0,11);save();R()}
function setSlot(k,v){const L=cur().lineup;L.slots=Array.from({length:11},(_,i)=>L.slots[i]||'');L.slots[k]=v;if(v)L.slots=L.slots.map((x,i)=>i!==k&&x===v?'':x);L.bench=L.bench.filter(b=>b!==v);save();R()}

async function chk(m){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(j.version&&j.version!==V){const b=$('#bn');b.style.display='flex';b.innerHTML=`🔔 Nuova versione disponibile<br>Attuale: v${V} → Nuova: v${e(j.version)}<button onclick="upd()">Aggiorna</button>`}else if(m)alert('Hai già l\'ultima versione (v'+V+')')}catch(x){if(m)alert('Impossibile controllare gli aggiornamenti (manca version.json o internet)')}}
async function upd(){try{(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister());(await caches.keys()).forEach(k=>caches.delete(k))}catch(x){}location.reload()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
fbInit();R();chk();setInterval(chk,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
